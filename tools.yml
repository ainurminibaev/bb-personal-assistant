# Общие инструменты платформы: что получает каждая установка.
#
# Установщик ставит каждую позицию, которая подходит виду установки (installs) и не исключена
# организацией или сотрудником. Позиция, которой нужен вход, ставится, а установщик печатает
# «нужен вход» и идёт дальше. core — основа установки: исключить нельзя.
#
# Виды установки: assistant — личный помощник, employee — сотрудник организации,
# agents — агент под своей учётной записью в BB агентов (deploy/agents).
#
# Как ставится (kind):
#   plugin — плагин BB: из git-источника (как у владельца, с диапазоном версий; обновляется штатно)
#            или из штатного каталога BB (builtin:<id>); subdirectory и tag_prefix — для плагина в папке
#            общего репозитория с метками <id>/vX.Y.Z;
#   npm    — пакет npm и его собственная настройка агентов (setup);
#   skill  — папка навыка из git-метки: в ~/.agents/skills (Codex) и ~/.claude/skills (Claude Code) учётки агента,
#            или навык, который приходит с плагином (plugin: <id>);
#   setting — что нужно настроить после установки (переменная или файл в закрытой папке); нет — «нужна настройка».
#   hook   — сценарий-хук из git-метки, ставится собственной командой --apply в настройки учётки;
#   cli    — команда из пакета платформы в папку программ учётки (path), с нужными программами (requires —
#            из пакетов системы, download — закреплённый выпуск со сверкой sha256);
#   service — служба сервера, одна на сервер вне любого BB: ставит установщик общих служб, здесь — только состояние.
# Описание формата и уровней — docs/tools.md.

tools:
  telegram-projects:
    what: Мост Telegram — чат и группы, поиск по истории переписки, отправка
    kind: plugin
    source: git:https://github.com/ainurminibaev/bb-plugin-telegram-projects.git@semver:^0.9.1-personal.24
    core: true
    installs: [assistant, employee]
    login: токен бота Telegram (шаги подключения — README)

  personal-assistant:
    what: Плагин платформы — ведение поручений (task-tracking), делегирование, замок гостевых тредов
    kind: plugin
    source: git:https://github.com/ainurminibaev/bb-personal-assistant.git@semver:^0.4.0
    core: true
    installs: [assistant, employee, agents]

  knowledge-base:
    what: Личная база знаний
    kind: plugin
    source: git:https://github.com/ainurminibaev/bb-personal-assistant.git@semver:^0.4.0
    subdirectory: plugins/knowledge-base
    installs: [assistant]

  thread-cleanup:
    what: Уборка законченных подтредов в архив раз в сутки, без хода модели; поручение — только закрытое
    kind: plugin
    source: git:https://github.com/ainurminibaev/bb-personal-assistant.git@semver:^0.4.3
    subdirectory: plugins/thread-cleanup
    installs: [assistant, employee, agents]

  image-gen:
    what: Генерация и правка картинок при любой модели агента; рисует Codex
    kind: plugin
    source: git:https://github.com/ainurminibaev/bb-config.git@^0.1.0
    subdirectory: plugins/image-gen
    tag_prefix: image-gen/
    installs: [assistant, employee, agents]
    login: вход Codex учётки, под которой работает BB (один на сервер)
    login_check: ~/.codex/auth.json

  context-mode:
    what: Большие выводы команд остаются вне контекста агента; Codex и Claude Code
    kind: npm
    package: context-mode
    version: 2.2.1
    agents: [codex, claude-code]
    installs: [assistant, employee, agents]

  agent-compat:
    what: Навык совместимости правил — AGENTS.md главный, CLAUDE.md одной строкой @AGENTS.md
    kind: skill
    repo: https://github.com/ainurminibaev/bb-config.git
    ref: shared-guides/v0.1.0
    path: plugins/shared-guides/skills/agent-compat
    present_with_plugin: shared-guides
    installs: [assistant, employee, agents]

  agent-mail:
    what: Своя почта агента — завести ящик через API почтового сервиса и читать письма с кодами
    kind: skill
    plugin: personal-assistant        # навык-инструкция приходит с плагином платформы
    setting:
      what: ключ почтового сервиса (настройка организации или владельца)
      env: AGENTMAIL_API_KEY
      file: ~/.secrets/agentmail.key
    installs: [assistant, employee, agents]

  claude-md-guard:
    what: Хук Claude Code — в CLAUDE.md только импорт @AGENTS.md, правила идут в AGENTS.md
    kind: hook
    repo: https://github.com/ainurminibaev/bb-config.git
    ref: v1.16.0
    path: scripts/claude_md_guard.py
    installs: [assistant, employee, agents]

  browser:
    what: Браузер агента — открывать страницы, читать, нажимать, заполнять формы, снимки (штатный BB)
    kind: plugin
    source: builtin:browser-automation
    plugin_id: browser-automation
    installs: [assistant, employee, agents]
    login: входы на сайты у каждого агента свои, общих нет
    # Сам браузер плагин ищет в <папка данных BB>/plugins/browser-automation/host-data/runtime/chrome.
    # Установщик кладёт туда официальную сборку Chrome for Testing (Google; sha256 закреплён, md5 сверен с
    # x-goog-hash хранилища) и недостающие библиотеки из пакетов Ubuntu (apt-get download, в систему не ставятся).
    # «Стоит» — только если браузер запускается.
    runtime:
      chrome_for_testing:
        version: 158.0.8127.36
        url: https://storage.googleapis.com/chrome-for-testing-public/{version}/linux64/chrome-linux64.zip
        sha256: dba9cc838e1ce269c33ea68170881127bd15d078fc3ca5891c90802819a4d7c7
      libraries: [libnss3, libnspr4, libatk1.0-0t64|libatk1.0-0, libatk-bridge2.0-0t64|libatk-bridge2.0-0,
                  libcups2t64|libcups2, libatspi2.0-0t64|libatspi2.0-0, libxcomposite1, libxdamage1, libxext6,
                  libxfixes3, libxrandr2, libxkbcommon0, libgbm1, libdrm2, libpango-1.0-0, libcairo2,
                  libasound2t64|libasound2, libx11-6, libxcb1, libglib2.0-0t64|libglib2.0-0, libdbus-1-3, libexpat1]

  secrets-store:
    what: Хранилище доступов — пароли, ключи и входы агента, свои и выданные; значения не печатаются (С37)
    kind: cli
    path: deploy/vallis-secret         # из пакета платформы; навык secrets-store приходит с плагином платформы
    requires: [age, age-keygen]        # официальный выпуск age, ставится рядом с командой; системный пакет не нужен
    download:                          # sops и age — официальные выпуски, закреплённые версии и суммы (sops — checksums.txt, age — digest выпуска на GitHub)
      age:
        version: v1.3.2
        version_args: [--version]
        url: https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-{arch}.tar.gz
        files: [age/age, age/age-keygen]
        sha256:
          amd64: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
          arm64: 6b8dc4333c53a5a57c9e5834e3a48f92605d7154014cd07269ff3327db5d37f4
      sops:
        version: v3.13.3
        url: https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.{arch}
        sha256:
          amd64: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
          arm64: 53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77
    installs: [assistant, employee, agents]

  speech:
    what: Расшифровка речи каскадом — выбор исполнителя, русская и татарская модели, Codex; одна служба на сервер
    kind: service
    check_commands: [voice-to-text]
    check_units: {ru: bb-speech-ru.socket, multi: bb-speech-multi.socket}   # по профилям службы
    state_file: /var/lib/bb-speech/state.json   # пишет установщик службы: state, reason, profiles
    install: служба сервера — ставится установщиком общих служб сервера
    installs: [assistant, employee, agents]

  pdf:
    what: PDF с общим оформлением платформы, чтение PDF (pdftotext) и картинки HTML-карточек (схема разбора голосового) — vallis-pdf
    kind: service
    check_commands: [vallis-pdf, /usr/local/bin/vallis-pdf]   # на PATH учётки (--prefix) или на весь сервер
    check_run: [vallis-pdf, --check]   # что реально запускается: PDF, чтение PDF, схема
    required_parts: [PDF, чтение PDF]                  # схеме нужен ещё браузер учётки (строка «browser»)
    install: служба сервера — deploy/pdf/install.sh; всё в /opt/vallis-pdf, в систему ничего не ставится (pandoc — официальный выпуск с суммой; WeasyPrint с Pillow — закреплённые колёса с суммами; poppler-utils, шрифты DejaVu и недостающие библиотеки — пакеты Ubuntu распаковкой); схема — браузер из строки «browser»
    installs: [assistant, employee, agents]

  decide:
    what: Быстрое решение — выбор из списка, да/нет, оценка за секунды (реакции моста и др.); одна служба на сервер, провайдер в самой службе
    kind: service
    check_commands: [/usr/local/bin/vallis-decide]
    check_units: [bb-decide.socket]
    state_file: /var/lib/bb-decide/state.json   # пишет служба: state, reason (какой провайдер действует или чего нет)
    install: служба сервера — deploy/decide/install.sh; провайдеру нужен ключ OpenAI или собственный вход службы
    installs: [assistant, employee, agents]
